apiVersion: apps/v1
kind: Deployment
metadata:
  name: weber
  labels:
    app: weber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weber
  template:
    metadata:
      labels:
        app: weber
    spec:   

      volumes:
        - name: workspace-volume
          emptyDir: {}

      initContainers:
        - name: file-fetcher
          image: meeran666/file_accepter
          env:
            - name: BASE_FOLDER
              value: "user1"
            - name: MODE
              value: "init"
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace

      containers:
        - name: runner
          image: meeran666/ide_image
          ports:
            - containerPort: 3003
            - containerPort: 3000
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: weber
spec:
  selector:
    app: weber
  ports:
    - protocol: TCP
      name: ws
      port: 3003
      targetPort: 3003
    - protocol: TCP
      name: user
      port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weber
spec:
  ingressClassName: nginx
  rules:
    - host: weber.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weber
                port:
                  number: 3003

    - host: down.weber.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weber
                port:
                  number: 3000